name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can evaluate auth/prisma config.
      # No database connection is made during the build.
      DATABASE_URL: "mongodb://localhost:27017/ci?replicaSet=rs0"
      AUTH_SECRET: "ci-only-secret"
      AUTH_GOOGLE_ID: "ci"
      AUTH_GOOGLE_SECRET: "ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
